name: Soundness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint

  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          # Online audits (impostor commits, known-vulnerable actions) read public repositories.
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.1 zizmor --format github .github/workflows
